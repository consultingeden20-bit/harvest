services:
  - type: web
    name: harvest-rqic
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install
    startCommand: node src/backend/migrations/migrate.js && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SESSION_TIMEOUT
        value: "43200"
      - key: LOG_LEVEL
        value: "info"
      - key: DB_PATH
        value: "/data/harvest.sqlite"
